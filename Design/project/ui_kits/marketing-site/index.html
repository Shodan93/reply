<!-- @dsCard group="Marketing Site" viewport="1280x760" name="Marketing & Careers site" subtitle="Home, services, careers list, job detail, insights — click-through" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Arclight — Marketing Site</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Mosaic.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicesScreen.jsx"></script>
<script type="text/babel" src="CareersScreen.jsx"></script>
<script type="text/babel" src="JobDetailScreen.jsx"></script>
<script type="text/babel" src="InsightsScreen.jsx"></script>
<script type="text/babel">
const { Button, Card, Badge, IconButton, Input, Select, Checkbox, Radio, Switch, Tabs, Dialog, Toast, Tooltip, Tag } = window.ArclightDesignSystem_6b18d9;
function App(){
  const [route, setRoute] = React.useState('home');
  const [job, setJob] = React.useState(null);
  function nav(r){ setRoute(r); window.scrollTo(0,0); }
  function openJob(j){ setJob(j); setRoute('job'); window.scrollTo(0,0); }
  const activeLabel = { home: null, services: 'Services', careers: 'Careers', job: 'Careers', insights: 'Insights & Labs' }[route];
  return (
    <div>
      <SiteHeaderWrap active={activeLabel} nav={nav} />
      {route === 'home' && <HomeScreen Button={Button} Card={Card} Badge={Badge} IconButton={IconButton} Mosaic={Mosaic} onNavigate={nav} />}
      {route === 'services' && <ServicesScreen Card={Card} Tabs={Tabs} Badge={Badge} />}
      {route === 'careers' && <CareersScreen Card={Card} Select={Select} Input={Input} Tag={Tag} onOpenJob={openJob} />}
      {route === 'job' && <JobDetailScreen job={job} Button={Button} Badge={Badge} Dialog={Dialog} onBack={() => nav('careers')} />}
      {route === 'insights' && <InsightsScreen Card={Card} Badge={Badge} />}
      <SiteFooter />
    </div>
  );
}
function SiteHeaderWrap({ active, nav }){
  return <SiteHeaderClickable active={active} nav={nav} />;
}
function SiteHeaderClickable({ active, nav }){
  const map = { 'Services': 'services', 'Industries': 'services', 'Insights & Labs': 'insights', 'We are': 'home', 'Careers': 'careers' };
  const items = ['Services', 'Industries', 'Insights & Labs', 'We are', 'Careers'];
  return (
    <header style={{position:'sticky',top:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px var(--gutter)',background:'rgba(253,253,250,0.92)',backdropFilter:'blur(8px)',borderBottom:'var(--border-w) solid var(--border-subtle)'}}>
      <div onClick={()=>nav('home')} style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:22,letterSpacing:'var(--ls-tight)',cursor:'pointer'}}>Arclight</div>
      <nav style={{display:'flex',gap:28,fontFamily:'var(--font-body)',fontSize:'var(--text-small)',fontWeight:500}}>
        {items.map(it => <span key={it} onClick={()=>nav(map[it])} style={{color: it===active ? 'var(--ink-900)':'var(--text-secondary)',cursor:'pointer',fontWeight: it===active?700:500}}>{it}</span>)}
      </nav>
      <button onClick={()=>nav('careers')} style={{background:'var(--ink-900)',color:'var(--paper)',border:'none',borderRadius:'var(--radius-md)',padding:'10px 18px',fontFamily:'var(--font-display)',fontWeight:600,fontSize:14,cursor:'pointer'}}>Kontakt</button>
    </header>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
