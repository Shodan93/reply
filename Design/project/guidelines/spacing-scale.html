<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base, used as 4/8/12/16/24/32/48/64/96/128" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.bar{background:var(--violet-500);height:14px}
</style></head><body>
<div class="row"><div class="bar" style="width:var(--space-1)"></div>4</div>
<div class="row"><div class="bar" style="width:var(--space-2)"></div>8</div>
<div class="row"><div class="bar" style="width:var(--space-3)"></div>12</div>
<div class="row"><div class="bar" style="width:var(--space-4)"></div>16</div>
<div class="row"><div class="bar" style="width:var(--space-5)"></div>24</div>
<div class="row"><div class="bar" style="width:var(--space-6)"></div>32</div>
<div class="row"><div class="bar" style="width:var(--space-7)"></div>48</div>
<div class="row"><div class="bar" style="width:var(--space-8)"></div>64</div>
</body></html>
