<!-- @dsCard group="Spacing" viewport="700x180" name="Radius scale" subtitle="Sharp squares stay sharp; only pills/inputs round" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);display:flex;gap:16px;align-items:flex-end;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.box{width:90px;height:90px;background:var(--ink-100);border:var(--border-w) solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
</style></head><body>
<div class="box" style="border-radius:var(--radius-none)">none</div>
<div class="box" style="border-radius:var(--radius-sm)">sm 4</div>
<div class="box" style="border-radius:var(--radius-md)">md 8</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 16</div>
<div class="box" style="border-radius:var(--radius-pill)">pill</div>
</body></html>
