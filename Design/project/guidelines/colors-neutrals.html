<!-- @dsCard group="Colors" viewport="700x160" name="Base neutrals" subtitle="Ink and paper scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;font-family:var(--font-body);background:var(--surface-page)}
.row{display:flex;height:80px;border-radius:var(--radius-sm);overflow:hidden;border:var(--border-w) solid var(--border-subtle)}
.sw{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-family:var(--font-mono)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--ink-900);color:var(--paper)">900</div>
<div class="sw" style="background:var(--ink-700);color:var(--paper)">700</div>
<div class="sw" style="background:var(--ink-400);color:var(--white)">400</div>
<div class="sw" style="background:var(--ink-200);color:var(--ink-900)">200</div>
<div class="sw" style="background:var(--ink-100);color:var(--ink-900)">100</div>
<div class="sw" style="background:var(--paper);color:var(--ink-900)">paper</div>
</div>
</body></html>
